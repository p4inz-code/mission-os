# Mission OS — Calamares Installer Settings
#
# Per MOS-ENG-BUILD-001:
# - Calamares is the installer for Nightly/Beta releases
# - Custom Mission OS module handles post-install configuration
# - Partitioning uses Calamares' built-in partition module (safe)
#
# Installation paths:
#   /etc/calamares/settings.conf  (installer configuration)
#   /usr/share/calamares/modules/  (module definitions)

modules-search:
    - /usr/share/calamares/modules

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - users
        - mission-os
        - grubcfg
        - bootloader
        - networkcfg
        - hwclock
        - services-systemd
        - packages
        - chrootcfg
        - finished

branding: mission-os

prompt-install: true

dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: false
