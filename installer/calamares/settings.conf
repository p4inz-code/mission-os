# Mission OS — Calamares Installer Settings
#
# Per MOS-ENG-BUILD-001:
# - Calamares is the installer for Nightly/Beta releases
# - Custom Mission OS modules handle post-install configuration
# - Partitioning uses Calamares' built-in partition module (safe)
#
# Installation paths:
#   /etc/calamares/settings.conf  (installer configuration)
#   /usr/share/calamares/modules/  (Mission OS custom modules)
#   /usr/lib/<triplet>/calamares/modules/  (standard modules, via `local`)
#   /usr/lib/calamares/modules/  (calamares-settings-debian helpers)
#
# Sequence validated against the live-medium flow: the target rootfs is
# populated by `unpackfs` from the live squashfs (source
# /run/live/medium/live/filesystem.squashfs, see unpackfs.conf), so the
# `mount` module must run first and `users`/`packages` must run AFTER
# `unpackfs`. The Mission OS repository is staged by `mission-repo` before
# the `packages` step, and `mission-cleanup` removes live-environment
# leftovers after installation (P15/P16 Finding 2).

oem-setup: false

modules-search:
    - local
    - /usr/lib/calamares/modules
    - /usr/share/calamares/modules

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - mission-os
        - grubcfg
        - bootloader
        - mission-repo
        - packages
        - mission-cleanup
        - umount
    - show:
        - finished

branding: mission-os

prompt-install: true

quit-at-end: false
disable-cancel: false
disable-cancel-during-exec: false
dont-chroot: false
