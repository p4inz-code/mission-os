# Mission OS — Calamares packages module configuration
#
# MERGED from:
#   - Debian's calamares-settings-debian /etc/calamares/modules/packages.conf
#     (removes live-environment packages from the installed system), and
#   - Mission OS's offline-install additions (installs the four Mission OS
#     packages from the LOCAL file:// repository that the `mission-repo`
#     module staged into the target at /var/cache/mission/repo).
#
# This file is deployed to BOTH /etc/calamares/modules/packages.conf
# (overriding the calamares-settings-debian copy so this merged config is
# the one Calamares actually loads) and /usr/share/calamares/modules/
# (fallback for the modules-search path). See build-nightly.sh Phase 5.
#
# APT consumes only the file:// source written by mission-repo, so this step
# performs NO network I/O: installation works with networking disabled.
# `update` is deliberately FALSE: the mission-repo module (which runs right
# before this step) already ran `apt-get update` against the file:// source
# and tolerates the offline failure of the base Debian sources. Re-running
# `apt-get update` here would hit those unreachable base sources and exit
# non-zero (apt returns 100 when any index fails), which the Calamares
# packages module treats as a hard failure and aborts the whole install.

backend: apt

update: false

operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
  - install:
      - mission-core-dev
      - mission-crypto-dev
      - mission-driverd
      - mission-securityd
