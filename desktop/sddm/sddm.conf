# Mission OS — SDDM Display Manager Configuration
#
# Per MOS-ENG-RUNTIME-001 §2.1:
# - SDDM is the display manager for KDE Plasma
# - Wayland session is the default
# - Theme uses the Mission OS design language

[Autologin]
# Disabled by default for security
Session=plasmawayland

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
Numlock=on

[Theme]
Current=breeze
CursorTheme=breeze_cursors
Font=Noto Sans,10,-1,5,50,0,0,0,0,0

[Users]
MaximumUid=65000
MinimumUid=1000
HideShells=/sbin/nologin,/usr/sbin/nologin,/bin/false,/usr/bin/false
HideUsers=root,daemon,bin,sys,sync,games,man,lp,mail,news,uucp,proxy,www-data,backup,list,irc,_apt,nobody,systemd-coredump,systemd-network,systemd-resolve,messagebus,pulse,sshd,mission-security,mission-privileged

[Wayland]
EnableHiDPI=true
SessionCommand=/usr/share/sddm/scripts/wayland-session
