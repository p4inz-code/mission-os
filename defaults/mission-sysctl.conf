# Mission OS — Kernel sysctl Security Hardening
#
# Installed to /etc/sysctl.d/99-mission-os.conf
#
# These settings harden the Linux kernel for desktop use.
# No performance-impacting settings are changed without justification.

# ── Network Security ─────────────────────────────────────────────

# Disable IP forwarding (not a router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Disable source packet routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Disable ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0

# Enable RFC-recommended source validation
net.ipv4.conf.all.rp_filter = 1

# Disable ICMP redirect sending
net.ipv4.conf.all.send_redirects = 0

# Ignore ICMP broadcasts
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP errors
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Enable TCP SYN cookie protection
net.ipv4.tcp_syncookies = 1

# Disable TCP timestamps (reduces information leakage)
net.ipv4.tcp_timestamps = 0

# Protect against time-wait assassination
net.ipv4.tcp_rfc1337 = 1

# ── Kernel Hardening ─────────────────────────────────────────────

# Restrict dmesg to root only
kernel.dmesg_restrict = 1

# Restrict kernel pointer access
kernel.kptr_restrict = 2

# Restrict perf events to root only
kernel.perf_event_paranoid = 3

# Disable kexec (no unauthorized kernel replacement)
kernel.kexec_disabled = 1

# Disable ftrace debug to non-root
kernel.ftrace_enabled = 0

# ASLR (address space layout randomization)
kernel.randomize_va_space = 2

# Restrict BPF to privileged users
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_enable = 1
net.core.bpf_jit_harden = 2

# ── Memory / Kernel Protection ───────────────────────────────────

# NOTE: kernel.page_lock does NOT exist as a sysctl on any mainline
# kernel — it previously made systemd-sysctl.service FAIL at boot
# (unknown key, blocking basic.target). KPTI on x86 is controlled by
# the kernel command line (pti=on, default on modern kernels), not by
# a sysctl, so there is nothing to set here.

# Disable user-space access to kernel module mappings
# 0 = modules ENABLED — driverd loads kernel modules for hardware support
kernel.modules_disabled = 0

# ── Filesystem ───────────────────────────────────────────────────

# Protect FIFO/regular file creation in sticky directories
fs.protected_fifos = 2
fs.protected_regular = 2

# Protect symlink and hardlink creation
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# Increase max inotify watches (needed for modern desktop)
fs.inotify.max_user_watches = 1048576
