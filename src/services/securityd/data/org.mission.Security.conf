<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!--
    D-Bus system bus configuration for mission-securityd.

    Only the mission-security user may own the bus name.
    Console users may send messages to the service.
    All other default context is denied.
  -->

  <!-- Policy: mission-security user owns the bus name -->
  <policy user="mission-security">
    <allow own="org.mission.Security1"/>
    <allow send_destination="org.mission.Security1"/>
    <allow receive_sender="org.mission.Security1"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
    <allow send_type="signal"/>
  </policy>

  <!-- Policy: console (local) users may interact with the service -->
  <policy at_console="true">
    <allow send_destination="org.mission.Security1"/>
    <allow receive_sender="org.mission.Security1"/>
  </policy>

  <!-- Policy: default deny -->
  <policy context="default">
    <deny own="org.mission.Security1"/>
    <deny send_destination="org.mission.Security1"/>
  </policy>

</busconfig>
