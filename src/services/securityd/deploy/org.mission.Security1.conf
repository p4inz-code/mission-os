<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system bus policy for mission-securityd.

  Per MOS-ENG-IPC-001 §11.1 and MOS-ENG-MOD-001 §3.4:
  - The root user owns the org.mission.Security1 bus name
  - Default policy denies all access to the service
  - Console users (at_console=true) are allowed to send messages

  Installation: /usr/share/dbus-1/system.d/org.mission.Security1.conf
-->
<busconfig>
  <!-- Root owns the service name -->
  <policy user="root">
    <allow own="org.mission.Security1"/>
    <allow send_destination="org.mission.Security1"/>
    <allow receive_sender="org.mission.Security1"/>
  </policy>

  <!-- Default: deny all access to the service -->
  <policy context="default">
    <deny send_destination="org.mission.Security1"/>
    <deny receive_sender="org.mission.Security1"/>
  </policy>

  <!-- Console users can call methods on the service -->
  <policy at_console="true">
    <allow send_destination="org.mission.Security1"/>
    <allow receive_sender="org.mission.Security1"/>
  </policy>
</busconfig>
